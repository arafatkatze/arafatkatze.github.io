<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MTP3: draft three, verify, stream</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        background: #fff;
        color: #20313a;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        font-size: 13px;
      }
      main {
        max-width: 760px;
        margin: auto;
      }
      h1 {
        font-size: 14px;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 span {
        font-size: 10px;
        font-weight: 500;
        color: #65747b;
        letter-spacing: 0;
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
      }
      svg text {
        font-family: inherit;
        fill: #20313a;
        font-size: 13px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        margin-top: 9px;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 7px 11px;
        border: 1px solid #d9e2df;
        border-radius: 7px;
        background: #f4f7f5;
        color: #20313a;
        cursor: pointer;
      }
      button.active,
      button.primary {
        background: #20313a;
        color: #fff;
        border-color: #20313a;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #5a83ce;
        outline-offset: 2px;
      }
      label {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 12px;
      }
      input[type='range'] {
        width: 110px;
        accent-color: #28765e;
      }
      output {
        font-variant-numeric: tabular-nums;
        min-width: 38px;
      }
      .note {
        font-size: 11px;
        line-height: 1.5;
        color: #64737a;
        margin: 9px 0 0;
      }
      .result {
        font-size: 12px;
        line-height: 1.5;
        margin-top: 8px;
      }
      .muted {
        fill: #65747b;
        font-size: 11px;
      }
      .mono {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .bold {
        font-weight: 650;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .mini {
        background: #f4f7f5;
        border-radius: 8px;
        padding: 10px;
        font-size: 12px;
        line-height: 1.6;
      }
      @media (max-width: 440px) {
        body {
          padding: 10px;
        }
        .note {
          font-size: 10px;
        }
        h1 span {
          display: none;
        }
        svg text {
          font-size: 14px;
        }
        .controls {
          gap: 7px;
        }
        input[type='range'] {
          width: 90px;
        }
        .pair {
          gap: 7px;
        }
        .mini {
          padding: 7px;
        }
      }
      .stream {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        overflow-y: hidden;
        height: 35px;
        margin: 7px 0;
      }
      .token {
        animation: pop 0.65s ease;
        background: #e6f4ed;
        border-radius: 5px;
        padding: 5px 8px;
        white-space: nowrap;
        font:
          12px ui-monospace,
          monospace;
      }
      .live {
        color: #28765e !important;
      }
      .controls {
        margin-top: 4px;
      }
      button.primary {
        background: #176fab;
        border-color: #176fab;
      }
      svg rect,
      svg circle {
        transition: all 0.35s ease;
      }
      .pulse {
        animation: pulse 1s infinite;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Three tokens ahead. One verification. <span class="live">MTP3</span></h1>
      <div id="diagram"></div>
      <div class="stream" id="stream"></div>
      <div class="controls">
        <button id="next" class="primary">Next token →</button><button id="play">❚❚ Pause</button><button id="reset">↺ Reset</button
        ><button id="bad">Reject token 2</button>
      </div>
      <div id="status" class="result" aria-live="polite"></div>
      <p class="note">
        Illustrative greedy MTP3: accept a matching prefix; discard tokens from the first mismatch. All accepted can yield a bonus token. Our fastest
        final recipe used MTP1.
      </p>
    </main>
    <script>
      const TITLE = 'MTP3: draft three, verify, stream';
      const $ = (id) => document.getElementById(id);
      function box(x, y, w, h, fill) {
        return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${fill}"/>`;
      }
      function txt(x, y, t, cl = '', extra = '') {
        return `<text x="${x}" y="${y}" class="${cl}" ${extra}>${t}</text>`;
      }
      function svg(s, h = 140) {
        $('diagram').innerHTML = `<svg viewBox="0 0 560 ${h}" role="img" aria-label="${TITLE}">${s}</svg>`;
      }
      let phase = 0,
        n = 0,
        start = 0,
        wrong = false,
        out = [];
      const words = ['The', 'sky', 'is', 'blue', 'today', '.', 'We', 'can', 'see', 'the', 'sun', '.'];
      function word(i) {
        return words[i % words.length];
      }
      function reset() {
        phase = 0;
        n = 0;
        start = 0;
        out = [];
        wrong = false;
      }
      function draw() {
        let s =
          txt(5, 16, '1 · Draft 3 tokens', 'muted') + txt(201, 16, '2 · Main model verifies', 'muted') + txt(397, 16, '3 · Stream output', 'muted');
        for (let i = 0; i < 3; i++) {
          const x = 5 + i * 52,
            valid = !wrong || i === 0;
          const color = phase === 0 ? '#eeeaff' : phase > 0 && wrong && i === 1 ? '#ffe2d6' : phase > 0 && wrong && i === 2 ? '#eff2ef' : '#e2f1e9';
          s +=
            box(x, 30, 48, 35, color) +
            txt(x + 24, 52, wrong && i === 1 ? 'rain' : word(start + i), 'mono', 'text-anchor="middle" style="font-size:11px"');
          s +=
            box(201 + i * 52, 30, 48, 35, phase === 0 ? '#f2f4f2' : valid ? '#dbf0e5' : i === 1 ? '#ffe2d6' : '#eff2ef') +
            txt(225 + i * 52, 52, phase === 0 ? '?' : valid ? '✓' : i === 1 ? '×' : '—', 'bold', 'text-anchor="middle"');
        }
        s +=
          txt(174, 52, '→') +
          txt(369, 52, '→') +
          box(397, 30, 158, 35, phase === 2 ? '#dbf0e5' : '#f2f4f2') +
          txt(410, 52, phase === 2 ? (wrong ? '2 output tokens' : '4 output tokens') : 'waiting', 'bold');
        s +=
          txt(5, 82, 'Sequential lookahead', 'muted') +
          txt(201, 82, phase === 0 ? 'Not committed yet' : wrong ? 'Accept 1 · reject 2–3' : 'All 3 accepted', 'muted') +
          txt(397, 82, phase === 2 ? (wrong ? '1 accepted + correction' : '3 accepted + bonus') : 'Verified tokens only', 'muted');
        svg(s, 91);
        stream(out);
        $('status').textContent = [
          'MTP proposes three future tokens. None are output yet.',
          wrong ? 'Token 2 is wrong: keep token 1, discard tokens 2 and 3.' : 'The main model verifies all three proposed tokens.',
          wrong ? 'Stream the accepted first token and the main-model correction.' : 'Stream three accepted tokens plus one main-model bonus token.',
        ][phase];
      }
      function step() {
        if (phase === 2) {
          phase = 0;
          wrong = false;
          start = n;
        } else {
          phase++;
          if (phase === 2) {
            for (let i = 0; i < (wrong ? 2 : 4); i++) out.push(word(n++));
          }
        }
        draw();
      }
      $('bad').onclick = () => {
        playing = false;
        schedule();
        wrong = true;
        phase = 0;
        start = n;
        draw();
      };
      let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches,
        timer;
      function schedule() {
        clearInterval(timer);
        $('play').textContent = playing ? '❚❚ Pause' : '▶ Play';
        if (playing) timer = setInterval(step, 2200);
      }
      $('play').onclick = () => {
        playing = !playing;
        schedule();
      };
      $('next').onclick = () => {
        playing = false;
        schedule();
        step();
      };
      $('reset').onclick = () => {
        reset();
        draw();
      };
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) clearInterval(timer);
        else schedule();
      });
      function stream(words) {
        const el = $('stream');
        if (words.length < el.children.length) el.replaceChildren();
        for (let i = el.children.length; i < words.length; i++) {
          const token = document.createElement('span');
          token.className = 'token';
          token.textContent = words[i];
          el.appendChild(token);
        }
      }
      draw();
      schedule();
    </script>
  </body>
</html>
